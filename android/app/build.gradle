apply plugin: 'com.android.application'

android {
    namespace = "in.dawasnap.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.dawasnap.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keyProperties = new Properties()
            def propFile = file('keystore.properties')
            if (!propFile.exists()) {
                propFile = rootProject.file('keystore.properties')
            }
            if (propFile.exists()) {
                keyProperties.load(new FileInputStream(propFile))
            }
            def keystoreFile = file('release.keystore')
            if (!keystoreFile.exists()) {
                keystoreFile = rootProject.file('android/app/release.keystore')
            }
            if (!keystoreFile.exists()) {
                keystoreFile = rootProject.file('keystore/release.keystore')
            }
            if (keystoreFile.exists()) {
                def storePwd = keyProperties.getProperty('storePassword') ?: (System.getenv('ANDROID_STORE_PASSWORD') ?: 'Dawasnap123')
                def kAlias = keyProperties.getProperty('keyAlias') ?: (System.getenv('ANDROID_KEY_ALIAS') ?: 'DawaSnapAi')
                def kPwd = keyProperties.getProperty('keyPassword') ?: (System.getenv('ANDROID_KEY_PASSWORD') ?: 'Dawasnap123')
                storeFile keystoreFile
                storePassword storePwd
                keyAlias kAlias
                keyPassword kPwd
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Enable R8 code shrinking and DEX optimization
            minifyEnabled true
            // Enable unused resource shrinking
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    // Google Play Services Auth & Android Credential Manager for Native Google Sign-In
    implementation "com.google.android.gms:play-services-auth:$playServicesAuthVersion"
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text.trim()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease')) {
            throw new GradleException("CRITICAL: 'google-services.json' is missing from android/app/! It is required for Firebase services, Crashlytics, and Push Notifications in production release builds.")
        }
    }
    logger.warn("google-services.json not found. Push Notifications and Crashlytics plugins not applied in non-release mode.")
}
